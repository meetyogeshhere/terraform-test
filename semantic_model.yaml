name: company_data_model
description: Employee and company data

tables:
  - name: company_data
    description: Contains employee information
    base_table:
      database: CORTEX_DEMO
      schema: DOCS
      table: company_data

    dimensions:
      - name: employee_name
        description: Full name of employee
        expr: employee_name
        data_type: TEXT

      - name: department
        description: Department name like Engineering Marketing HR Sales
        expr: department
        data_type: TEXT

      - name: location
        description: Office location city
        expr: location
        data_type: TEXT

      - name: joining_date
        description: Date employee joined
        expr: joining_date
        data_type: DATE

    measures:
      - name: employee_count
        description: Total number of employees
        expr: COUNT(*)
        data_type: NUMBER

      - name: average_salary
        description: Average salary of employees
        expr: AVG(salary)
        data_type: NUMBER

      - name: total_salary
        description: Total salary cost
        expr: SUM(salary)
        data_type: NUMBER

      - name: salary
        description: Individual employee salary in USD
        expr: salary
        data_type: NUMBER
